<!--
PROTOTYPE SCREEN: V3-03 — Mark workflow entities as company level
BLOCKS: ProtoChrome, AppShell, LifecycleBanner, Button, Toast
JOURNEY BEAT: any_builder → publish immediately · gated policies → pending approval
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V3-03 · Mark as company level</title>
  <link rel="stylesheet" href="../../css/tokens.css?v=20261007122200" />
  <link rel="stylesheet" href="../../css/base.css?v=20261007122200" />
  <link rel="stylesheet" href="../../css/components.css?v=20261007122200" />
  <link rel="stylesheet" href="../../css/screens.css?v=20261007122200" />
</head>
<body class="screen-submit">
  <div data-block="AppShell" class="flex" style="min-height:calc(100vh - 44px)">
    <aside class="app-shell__sidebar">
      <div class="app-shell__logo">
        <span class="app-shell__logo-mark">n8</span>
        <span>n8n · Acme</span>
      </div>
      <nav class="app-shell__nav">
        <a class="nav-item" href="06-blocks-gallery.html?proto=v3"><span class="nav-item__icon">◈</span> Building blocks</a>
        <a class="nav-item is-active" href="02-builder-rails.html?proto=v3"><span class="nav-item__icon">✎</span> Editor</a>
      </nav>
      <div class="app-shell__footer">Short path · V3</div>
    </aside>

    <div class="app-shell__main">
      <header class="app-shell__topbar">
        <strong id="page-title">Mark as company level</strong>
        <a class="btn btn--ghost btn--sm" href="02-builder-rails.html?proto=v3">← Back to editor</a>
      </header>
      <div class="app-shell__content">
        <div class="lifecycle-banner" id="lifecycle-banner" data-block="LifecycleBanner" style="border-radius:8px;margin-bottom:24px;border:1px solid var(--border);max-width:720px">
          <span class="badge" id="lifecycle-badge">Published</span>
          <span id="lifecycle-copy"></span>
        </div>

        <div class="submit-vs-publish" id="contrast-cards" style="margin-bottom:24px;max-width:720px">
          <div class="contrast-card contrast-card--good" id="contrast-primary">
            <strong id="contrast-primary-title">Mark as company level</strong>
            <span id="contrast-primary-body"></span>
          </div>
          <div class="contrast-card contrast-card--muted" id="contrast-secondary">
            <strong id="contrast-secondary-title">Live for Members</strong>
            <span id="contrast-secondary-body"></span>
          </div>
        </div>

        <form id="submit-form" class="submit-form submit-form--wide" data-block="SubmitEntityForm">
          <div class="submit-form__fields">
            <div class="entity-picker">
              <div class="entity-list__header">
                <div>
                  <label style="margin:0">Entities in this workflow</label>
                  <p class="secondary" style="margin:4px 0 0;font-size:12px" id="entity-hint">
                    From <strong>Okta user resolve</strong> — select all or some to mark.
                  </p>
                </div>
                <div class="entity-list__bulk">
                  <button type="button" class="btn btn--ghost btn--sm" id="btn-select-all">Select all</button>
                  <button type="button" class="btn btn--ghost btn--sm" id="btn-clear">Clear</button>
                </div>
              </div>
              <div class="entity-list" id="entity-list" role="group" aria-label="Workflow entities"></div>
              <p class="secondary" id="selection-count" style="margin-top:10px;font-size:12px"></p>
            </div>
            <div class="field">
              <label for="bb-note" id="bb-note-label">Library note</label>
              <textarea id="bb-note">Reusable candidates from Okta user resolve.</textarea>
            </div>
            <div class="field">
              <label for="bb-owner">Owner</label>
              <input id="bb-owner" value="You" required />
            </div>
          </div>
          <div class="submit-form__actions">
            <a class="btn btn--ghost" href="02-builder-rails.html?proto=v3">Cancel</a>
            <button type="submit" class="btn btn--primary" id="btn-submit" data-block="Button">
              Mark selected as company level
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../../js/state.js?v=20261007122200"></script>
  <script src="../../js/interactions.js?v=20261007122200"></script>
  <script>
    (function () {
      if (ProtoState.getProtoVersion() !== "v3") {
        ProtoState.setProtoVersion("v3", { reload: false });
      }
      ProtoState.setRole("builder");
      const params = new URLSearchParams(window.location.search || "");
      const beat = params.get("beat");
      // Blocks happy-path card from the demo map → publish immediately (no sticky gated policy).
      // Menu navigation omits beat= so custom_role+grant can still demo pending approval.
      if (beat === "V3-03") {
        ProtoState.setMarkPolicy("any_builder");
      }
      if (!ProtoState.canMarkCompanyLevel()) {
        ProtoUI.toast(
          "Marking restricted — " + ProtoState.markPolicyLabel(),
          "danger"
        );
        setTimeout(function () {
          window.location.href = "02-builder-rails.html?proto=v3&beat=V3-02d";
        }, 500);
        return;
      }

      const immediate = ProtoState.marksPublishImmediately();
      const entities = ProtoState.WORKFLOW_SUBMIT_ENTITIES || [];
      const listEl = document.getElementById("entity-list");
      const countEl = document.getElementById("selection-count");
      const submitBtn = document.getElementById("btn-submit");

      function applyPolicyCopy() {
        const banner = document.getElementById("lifecycle-banner");
        const badge = document.getElementById("lifecycle-badge");
        if (immediate) {
          document.title = "V3-03 · Mark as company level";
          document.getElementById("page-title").textContent = "Mark as company level";
          banner.className = "lifecycle-banner lifecycle-banner--golden";
          badge.className = "badge badge--golden";
          badge.textContent = "Publishes now";
          document.getElementById("lifecycle-copy").innerHTML =
            "Marking creates <strong>Published</strong> company blocks — Members can use them immediately.";
          document.getElementById("contrast-primary-title").textContent =
            "Mark as company level";
          document.getElementById("contrast-primary-body").textContent =
            "Selected entities become live company blocks. Stays inside Acme.";
          document.getElementById("contrast-secondary-title").textContent =
            "No Admin queue";
          document.getElementById("contrast-secondary-body").textContent =
            "Policy is Any builder — mark publishes; no pending approval.";
          document.getElementById("entity-hint").innerHTML =
            "From <strong>Okta user resolve</strong> — select all or some to mark as company level.";
          document.getElementById("bb-note-label").textContent = "Library note";
          document.getElementById("bb-note").value =
            "Reusable candidates from Okta user resolve.";
          submitBtn.textContent = "Mark selected as company level";
        } else {
          document.title = "V3-03 · Submit for company approval";
          document.getElementById("page-title").textContent = "Submit for company approval";
          banner.className = "lifecycle-banner lifecycle-banner--draft";
          badge.className = "badge badge--draft";
          badge.textContent = "Not published";
          document.getElementById("lifecycle-copy").innerHTML =
            "Submitting creates <strong>Pending</strong> company blocks — Members cannot use them until an Admin approves.";
          document.getElementById("contrast-primary-title").textContent =
            "Submit for company approval";
          document.getElementById("contrast-primary-body").textContent =
            "Selected entities go to the Admin queue. Stays inside Acme.";
          document.getElementById("contrast-secondary-title").textContent =
            "Live for Members";
          document.getElementById("contrast-secondary-body").textContent =
            "Only after Admin approve. Submit ≠ publish.";
          document.getElementById("entity-hint").innerHTML =
            "From <strong>Okta user resolve</strong> — select all or some to submit.";
          document.getElementById("bb-note-label").textContent = "Note to Admin";
          document.getElementById("bb-note").value =
            "Reusable candidates from Okta user resolve — please review for company library.";
          submitBtn.textContent = "Submit selected for approval";
        }
      }

      function selectedIds() {
        return Array.prototype.map.call(
          listEl.querySelectorAll('input[type="checkbox"]:checked'),
          function (cb) {
            return cb.value;
          }
        );
      }

      function updateCount() {
        const n = selectedIds().length;
        const total = entities.filter(function (e) {
          return e.kind !== "agent" || e.name;
        }).length;
        if (n === 0) {
          countEl.textContent = "Nothing selected — pick at least one entity.";
        } else if (immediate) {
          countEl.textContent =
            n + " of " + total + " selected · will publish as company blocks now";
        } else {
          countEl.textContent =
            n + " of " + total + " selected · pending until Admin approves";
        }
        submitBtn.disabled = n === 0;
      }

      function renderList() {
        const byKind = { workflow: [], tool: [], skill: [], agent: [] };
        entities.forEach(function (e) {
          if (!byKind[e.kind]) byKind[e.kind] = [];
          byKind[e.kind].push(e);
        });

        const order = [
          { key: "workflow", label: "Workflow" },
          { key: "tool", label: "Tools" },
          { key: "skill", label: "Skills" },
          { key: "agent", label: "Agents" },
        ];

        let html = "";
        order.forEach(function (section) {
          const items = byKind[section.key] || [];
          html += '<div class="entity-section">';
          html += '<div class="entity-section__label">' + section.label + "</div>";
          if (!items.length) {
            html += '<div class="entity-empty">None in this workflow</div>';
          } else {
            html += items
              .map(function (e) {
                const checked = e.preselected ? " checked" : "";
                return (
                  '<label class="entity-row' +
                  (e.preselected ? " is-selected" : "") +
                  '">' +
                  '<input type="checkbox" name="entity" value="' +
                  e.id +
                  '"' +
                  checked +
                  ' aria-label="' +
                  e.name +
                  '" />' +
                  '<div class="entity-row__body">' +
                  '<div class="entity-row__title">' +
                  "<span>" +
                  e.name +
                  "</span>" +
                  (ProtoUI.kindBadge ? ProtoUI.kindBadge(e.kind) : "") +
                  "</div>" +
                  '<div class="entity-row__desc">' +
                  (e.description || "") +
                  "</div>" +
                  (e.caps && e.caps.length
                    ? '<div class="entity-row__caps">' +
                      e.caps
                        .map(function (c) {
                          return '<span class="node-chip">' + c + "</span>";
                        })
                        .join("") +
                      "</div>"
                    : "") +
                  "</div></label>"
                );
              })
              .join("");
          }
          html += "</div>";
        });
        listEl.innerHTML = html;

        listEl.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
          cb.addEventListener("change", function () {
            cb.closest(".entity-row").classList.toggle("is-selected", cb.checked);
            updateCount();
          });
        });
        updateCount();
      }

      document.getElementById("btn-select-all").addEventListener("click", function () {
        listEl.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
          cb.checked = true;
          cb.closest(".entity-row").classList.add("is-selected");
        });
        updateCount();
      });

      document.getElementById("btn-clear").addEventListener("click", function () {
        listEl.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
          cb.checked = false;
          cb.closest(".entity-row").classList.remove("is-selected");
        });
        updateCount();
      });

      document.getElementById("submit-form").addEventListener("submit", function (e) {
        e.preventDefault();
        const ids = selectedIds();
        if (!ids.length) return;

        const selected = entities.filter(function (ent) {
          return ids.indexOf(ent.id) >= 0;
        });
        const created = ProtoState.submitCompanyBlocks(selected, {
          owner: document.getElementById("bb-owner").value,
          note: document.getElementById("bb-note").value,
        });
        if (!ProtoState.get().libraryEnabled) {
          ProtoState.setLibraryEnabled(true);
        }
        const n = created.length;
        const published = ProtoState.marksPublishImmediately();
        sessionStorage.setItem(
          "proto-flash",
          JSON.stringify({
            message: published
              ? "Marked " +
                n +
                " company block" +
                (n === 1 ? "" : "s") +
                " — published and live for Members"
              : "Submitted " +
                n +
                " pending block" +
                (n === 1 ? "" : "s") +
                " — not live for Members until Admin approves",
            type: published ? "success" : "warning",
          })
        );
        window.location.href = "07-compose-canvas.html?proto=v3&beat=V3-07b";
      });

      applyPolicyCopy();
      renderList();
    })();
  </script>
</body>
</html>
